name: Go CI

on:
  push:
    paths:
      - "go-hello-world/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go-hello-world/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-hello-world
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-hello-world/go.mod
          cache-dependency-path: go-hello-world/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
